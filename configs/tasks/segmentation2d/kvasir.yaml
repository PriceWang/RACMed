experiment_name: kvasir_segmentation2d
output_dir: outputs/experiments/kvasir
teacher_output_dir: outputs/experiments/kvasir/teacher/native
comparison_teacher_output_dir: outputs/experiments/kvasir/teacher/matched_test
seed: 0
device: auto
task_type: segmentation2d
model: {task_type: segmentation2d, num_classes: 2, in_channels: 3}
dataset:
  type: segmentation2d
  name: kvasir_seg
  root: "${RACMED_DATA_ROOT}/kvasir_seg"
  image_size: [352, 352]
  in_channels: 3
  num_classes: 2
  binary_mask_threshold: 127
  prompt_boxes: true
  box_perturb: 0
  train_box_perturb: 10
teacher:
  source: medsam
  backend: official_sam
  name: medsam-vit-base
  model_dir: "${RACMED_MODEL_ROOT}/medsam-vit-base"
  require_local_weights: true
  pretrained: true
  num_classes: 2
  in_channels: 3
  sam_input_size: 1024
  checkpoint_file: "${RACMED_MODEL_ROOT}/medsam-vit-base/medsam_vit_b.pth"
compressed_model:
  source: custom
  name: compact_unet2d
  pretrained: false
  channels: [16, 32, 64]
  prompt_aware: true
training:
  epochs: 50
  batch_size: 8
  num_workers: 2
  optimizer: adamw
  lr: 0.0005
  weight_decay: 0.00001
  scheduler: cosine
  amp: true
  gradient_accumulation_steps: 1
  gradient_clip_norm: 5.0
  early_stopping_patience: 12
  cache_teacher_outputs: true
  teacher_cache_dir: outputs/cache/teacher/kvasir_medsam_352
  cache_static_risk: true
  save_best_by: val_reliability_score
  reliability_weights: {dice: 0.7, boundary_f1: 0.1, precision: 0.1, small_component_recall: 0.05, false_negative_lesion_rate: 0.05}
loss: {temperature: 3.0, lambda_global: 0.3, baseline_kd_weight: 0.3, lambda_local: 0.05, local_feature_mode: attention, local_logit_weight: 1.0, lambda_boundary: 0.05, lambda_relation: 0.0, lambda_calib: 0.02, lambda_sparse: 0.0, focal_gamma: 1.0, risk_supervision_strength: 1.0, risk_supervision_foreground_only: true}
risk: {alpha_boundary: 2.0, alpha_small: 2.0, alpha_entropy: 1.0, alpha_disagreement: 1.0, alpha_class: 1.0, small_component_threshold: 256}
compression:
  max_prune_ratio: 0.50
  target_global_sparsity: 0.20
  allocation_mode: risk_adjusted_magnitude
  risk_protection_strength: 2.0
  protected_layer_patterns: [head, classifier, ".out."]
  use_risk_map: true
  high_threshold: 0.7
  pruning_method: elastic
  structural_backend: true
  post_prune_finetune:
    enabled: true
    mode: racmed
    epochs: 12
    lr: 5.0e-5
    early_stopping_patience: 4
    validation_interval: 1
    evaluate_initial_checkpoint: true
  quantization: risk_aware_mixed
deployment:
  model_role: compressed_model
  reliability_provider: auto
  reliability_surface_metrics: false
  input_size: [352, 352]
  dynamic_axes: true
  warmup: 10
  repetitions: 100
evaluation:
  compression_threshold_policy: source_validation
  segmentation_threshold_calibration: true
  segmentation_threshold_objective: reliability
  segmentation_threshold_max_dice_drop: 0.01
  threshold_candidates: [0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
  segmentation_threshold_weights: {dice: 0.55, boundary_f1: 0.10, precision: 0.05, small_component_recall: 0.15, false_negative_lesion_rate: 0.15}
  lesion_threshold_candidates: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 0.99, 1.0]
  froc_workers: 4
  lesion_component_min_iou: 0.10
  froc_max_fp_per_case: 4.0
  froc_auc_fp_limits: [4.0]
  froc_fp_targets: [0.25, 0.5, 1.0, 2.0, 4.0]
teacher_evaluation:
  dataset_split_policy: all_labeled
  dataset_image_size: [352, 352]
  reported_metrics: {dice: 0.977}
  gates:
    - {metric: median_dice, minimum: 0.95}
reporting: {save_per_case: true, bootstrap_ci: true, statistical_tests: true}
pipeline:
  evaluate_teacher: true
  methods: [standalone, vanilla_kd, attention_kd, relation_kd, racmed]
  seeds: [0, 1, 2]
  training_variants:
    - name: ablation_no_structural_risk
      method: racmed
      seeds: [0, 1, 2]
      overrides:
        risk: {alpha_boundary: 0.0, alpha_small: 0.0}
    - name: ablation_no_predictive_risk
      method: racmed
      seeds: [0, 1, 2]
      overrides:
        risk: {alpha_entropy: 0.0, alpha_disagreement: 0.0}
    - name: ablation_no_risk_gating
      method: racmed
      seeds: [0, 1, 2]
      overrides:
        loss: {risk_gating_enabled: false}
  fixed_threshold_sensitivity:
    threshold: 0.5
    methods: [standalone, vanilla_kd, racmed]
    seeds: [0, 1, 2]
  compression_variants:
    - name: racmed_structural_elastic_20
      method: racmed
      seeds: [0, 1, 2]
      export: true
      export_seeds: [0, 1, 2]
      evaluate_onnx: true
      tensorrt_qdq: true
      benchmark: true
      benchmark_seeds: [0]
      overrides:
        deployment: {reliability_artifacts: [onnx_fp32, onnx_uniform_qdq_int8, onnx_risk_aware_qdq_int8]}
    - name: uniform_structural_magnitude_20
      method: racmed
      seeds: [0, 1, 2]
      export: false
      benchmark: true
      benchmark_seeds: [0]
      overrides:
        compression: {pruning_method: magnitude, structural_backend: true, target_global_sparsity: 0.20, max_prune_ratio: 0.20, use_risk_map: false}
