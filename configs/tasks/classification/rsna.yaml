experiment_name: rsna_classification
output_dir: outputs/experiments/rsna
teacher_output_dir: outputs/experiments/rsna/teacher/native
comparison_teacher_output_dir: outputs/experiments/rsna/teacher/native
seed: 0
task_type: classification
device: auto
model:
  task_type: classification
  num_classes: 1
  in_channels: 1
dataset:
  type: rsna
  name: rsna
  root: "${RACMED_DATA_ROOT}/rsna"
  image_size: [224, 224]
  views: [PA, AP]
  in_channels: 1
  num_classes: 2
  split_seed: 0
  unit_scale: true
  preload: true
  preload_cache_dir: outputs/cache/rsna_224_fp16
  preload_device: auto
  preload_workers: 8
  preload_batch_size: 64
teacher:
  source: torchxrayvision
  name: densenet121
  weights: densenet121-res224-all
  cache_dir: "${RACMED_MODEL_ROOT}/torchxrayvision"
  pathology: Lung Opacity
  require_local_weights: true
  xrv_normalize: true
  pretrained: true
  num_classes: 1
  in_channels: 1
compressed_model:
  source: timm
  name: mobilenetv3_small_100
  pretrained: true
  num_classes: 1
  in_channels: 1
training:
  epochs: 30
  batch_size: 64
  num_workers: 4
  pin_memory: true
  prefetch_factor: 4
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.00001
  scheduler: cosine
  amp: true
  gradient_accumulation_steps: 1
  gradient_clip_norm: 5.0
  early_stopping_patience: 8
  cache_teacher_outputs: true
  save_best_by: val_reliability_score
  reliability_weights: {auc: 0.60, balanced_accuracy: 0.20, worst_class_sensitivity: 0.10, ece: 0.10}
loss:
  temperature: 3.0
  lambda_global: 0.5
  lambda_local: 0.0
  lambda_boundary: 0.0
  lambda_relation: 0.0
  lambda_calib: 0.05
  lambda_sparse: 0.0
  teacher_correctness_gating: true
method_overrides:
  racmed:
    initialize_from: standalone
    training: {epochs: 12, lr: 3.0e-5, early_stopping_patience: 4, evaluate_initial_checkpoint: true, model_selection_min_delta: 0.001}
    loss: {lambda_global: 0.05, lambda_calib: 0.02}
    evaluation: {classification_logit_calibration: true}
risk: {alpha_entropy: 1.0, alpha_disagreement: 1.0, alpha_class: 1.0, alpha_margin: 1.0, teacher_temperature: auto, teacher_temperature_max_batches: 40}
compression:
  max_prune_ratio: 0.50
  target_global_sparsity: 0.20
  allocation_mode: risk_adjusted_magnitude
  risk_protection_strength: 2.0
  protected_layer_patterns: [head, classifier]
  use_risk_map: true
  high_threshold: 0.7
  max_int8_fraction: 0.25
  pruning_method: elastic
  structural_backend: true
  post_prune_finetune:
    enabled: true
    mode: racmed
    epochs: 8
    lr: 3.0e-5
    early_stopping_patience: 3
    validation_interval: 1
  quantization: risk_aware_mixed
deployment: {model_role: compressed_model, input_size: [224, 224], dynamic_axes: true, warmup: 10, repetitions: 100}
evaluation: {threshold_strategy: youden, compression_calibration_policy: source_validation}
teacher_evaluation:
  split: test
  reported_metrics: {auc: 0.88}
  gates:
    - {metric: auc, minimum: 0.86}
reporting: {save_per_case: true, bootstrap_ci: true, statistical_tests: true}
pipeline:
  evaluate_teacher: true
  methods: [standalone, vanilla_kd, attention_kd, relation_kd, racmed]
  seeds: [0, 1, 2]
  training_variants:
    - name: ablation_no_target_risk
      method: racmed
      seeds: [0, 1, 2]
      overrides:
        risk: {alpha_class: 0.0}
    - name: ablation_no_predictive_risk
      method: racmed
      seeds: [0, 1, 2]
      overrides:
        risk: {alpha_entropy: 0.0, alpha_disagreement: 0.0, alpha_margin: 0.0}
    - name: ablation_no_risk_gating
      method: racmed
      seeds: [0, 1, 2]
      overrides:
        loss: {risk_gating_enabled: false}
  compression_variants:
    - name: racmed_structural_elastic_20
      method: racmed
      seeds: [0, 1, 2]
      export: true
      export_seeds: [0, 1, 2]
      evaluate_onnx: true
      tensorrt_qdq: true
      benchmark: true
      benchmark_seeds: [0]
      overrides:
        deployment: {reliability_artifacts: [onnx_fp32, onnx_uniform_qdq_int8, onnx_risk_aware_qdq_int8]}
    - name: uniform_structural_magnitude_20
      method: racmed
      seeds: [0, 1, 2]
      export: false
      benchmark: true
      benchmark_seeds: [0]
      overrides:
        compression: {pruning_method: magnitude, structural_backend: true, target_global_sparsity: 0.20, max_prune_ratio: 0.20, use_risk_map: false}
